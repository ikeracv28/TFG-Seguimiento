name: CI — Nexus TFG

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: Backend — Compila y ejecuta todos los tests + JaCoCo
  # -----------------------------------------------------------------------
  backend-test:
    name: Backend Tests (Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tfg_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests with Maven
        working-directory: backend/tfg-nexus-api
        env:
          JWT_SECRET: ci_test_secret_key_only_for_testing_purposes_not_production
        run: ./mvnw verify -B

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/tfg-nexus-api/target/site/jacoco/

  # -----------------------------------------------------------------------
  # JOB 2: Frontend — Analiza y ejecuta tests de Flutter
  # -----------------------------------------------------------------------
  frontend-test:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Run tests
        working-directory: frontend
        run: flutter test

  # -----------------------------------------------------------------------
  # JOB 3: Frontend — Build de producción (solo en push a main)
  # -----------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Production)
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build web (release)
        working-directory: frontend
        env:
          API_URL: ${{ vars.API_URL || 'http://localhost:8080/api/v1' }}
        run: flutter build web --release --dart-define=API_URL=$API_URL

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: frontend/build/web/
